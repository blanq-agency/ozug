title: Outline
tabs:
  main:
    display: Hauptteil
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              localizable: true
              validate:
                - required
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              localizable: false
              validate:
                - required
          -
            handle: parent
            field:
              type: entries
              collections:
                - commentaries
              max_items: 1
              listable: false
              localizable: true
          -
            handle: show_nested_commentaries
            field:
              type: toggle
              display: 'Verschachtelte Kommentierungen anzeigen'
              instructions: 'Hinweis: Listet auf der Übersichtsseite alle untergeordneten Kommentierungen auf, nicht nur die direkt untergeordneten.'
              default: false
              localizable: false
